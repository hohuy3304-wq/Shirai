<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><base target="_blank">
<style>
*{box-sizing:border-box}body{margin:0;padding:4px 22px 20px;color:#142e31;font:14px Arial,sans-serif;background:#fafcfb}fieldset{border:0;border-bottom:1px solid #d5e1df;margin:0 0 18px;padding:0 0 16px}legend{font-size:17px;font-weight:650;padding:10px 0;color:#145b54}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}.wide{grid-column:1/-1}label{display:grid;gap:5px}input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid #95aaa6;border-radius:5px;background:white;color:inherit}textarea{resize:vertical}button{padding:10px 18px;border:0;border-radius:5px;background:#075c51;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.55}small{color:#46615c}p{line-height:1.45}#message{white-space:pre-line}a{color:#075c51;margin-right:15px}[hidden]{display:none!important}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body>
<p id="message" role="status" aria-live="polite">Đang tải danh mục…</p>
<form id="form" hidden><fieldset><legend>Loại hợp đồng và khách hàng</legend><div class="grid">
<small id="seller" class="wide"></small>
<label>Loại hợp đồng<select name="Loai_HD" required></select></label>
<label>Khách hàng<select name="Ma_KH"></select></label>
<small id="summary" class="wide"></small></div>
<div id="newCustomer" class="grid" hidden>
<label>Tên khách hàng<input name="Ten_Cong_Ty"></label><label>Địa chỉ<input name="Dia_Chi"></label>
<label>Mã số thuế<input name="MST"></label><label>Người đại diện<input name="Nguoi_Dai_Dien"></label>
<label>Chức vụ<input name="Chuc_Vu"></label><label>Điện thoại<input name="SDT" type="tel"></label>
<label>Email khách hàng<input name="Email" type="email"></label><label>Tài khoản ngân hàng<input name="Tai_Khoan_NH"></label>
</div></fieldset>
<fieldset><legend>Thỏa thuận</legend><div class="grid">
<label class="wide">Nội dung công việc hoặc hàng hóa<textarea name="Noi_Dung_HD" rows="2" required></textarea></label>
<label>Ngày ký<input type="date" name="Ngay_Ky" required></label>
<label>Người phụ trách (email)<input type="email" name="Nguoi_Phu_Trach" required></label>
<label>Ngày hiệu lực<input type="date" name="Ngay_Hieu_Luc" required></label>
<label>Ngày hết hạn<input type="date" name="Ngay_Het_Han" required></label>
<label>Giá trị hợp đồng (VND)<input name="Gia_Tri" inputmode="numeric" placeholder="15.500.000" required></label>
<label>Điều khoản thanh toán<textarea name="Dieu_Khoan_Thanh_Toan" rows="2" required></textarea></label>
<label class="wide">Ghi chú (tùy chọn)<input name="Ghi_Chu"></label>
</div></fieldset>
<button id="submit" type="submit">Tạo hợp đồng và PDF</button></form>
<p id="links"></p>
<script>
const form = document.querySelector('#form'), fields = form.elements, message = document.querySelector('#message');
const submit = document.querySelector('#submit'), extra = document.querySelector('#newCustomer');
let customers = [], token, pending = false, payload;
function updateCustomer(){
  const customer = customers.find(c=>c.code === fields.Ma_KH.value);
  extra.hidden = !!customer;
  for(const input of extra.querySelectorAll('input')) input.disabled = !!customer;
  fields.Ten_Cong_Ty.required = fields.Dia_Chi.required = !customer;
  document.querySelector('#summary').textContent = customer ?
    [customer.code,customer.address,customer.tax].filter(Boolean).join(' · ') : 'Nhập tên và địa chỉ. Khách hàng này sẽ được lưu để chọn lại lần sau.';
}
fields.Ma_KH.onchange = updateCustomer;
google.script.run.withFailureHandler(err=>{message.textContent=err.message;}).withSuccessHandler(data=>{
  customers=data.customers; token=data.token;
  document.querySelector('#seller').textContent = data.seller ? 'Bên cung cấp: '+data.seller : 'Chưa có thông tin bên cung cấp. Điền tên và thông tin doanh nghiệp một lần trong tab CauHinh.';
  for(const type of data.types) fields.Loai_HD.add(new Option(type,type));
  for(const c of customers) fields.Ma_KH.add(new Option(c.name+' · '+c.code,c.code));
  fields.Ma_KH.add(new Option('Thêm khách hàng mới…',''));
  fields.Ngay_Ky.value=fields.Ngay_Hieu_Luc.value=data.today;
  fields.Nguoi_Phu_Trach.value=data.email;
  updateCustomer(); message.textContent=data.types.length?'':'Thêm loại hợp đồng vào tab Mau để bắt đầu.'; form.hidden=false;
}).layDanhMucPhieu();
function finish(result){
  pending=false;
  if(result.error){
    message.textContent=result.error+(result.saved?'\nĐã lưu phiếu ở dòng '+result.row+'. Có thể thử xuất lại ngay tại đây.':'');
    if(result.saved){
      for(const section of form.querySelectorAll('fieldset')) section.disabled=true;
      submit.textContent='Thử xuất lại';
    }else payload=null;
    submit.disabled=false; message.scrollIntoView(); return;
  }
  form.hidden=true; message.textContent='Đã tạo hợp đồng '+result.number+'.';
  for(const [label,url] of [['Mở Google Docs',result.docs],['Mở PDF',result.pdf]]){
    if(!/^https:\/\/(docs|drive)\.google\.com\//.test(url)) continue;
    const a=document.createElement('a'); a.textContent=label; a.href=url; a.rel='noopener'; document.querySelector('#links').append(a);
  }
}
form.onsubmit=e=>{
  e.preventDefault(); if(pending)return;
  if(!payload) payload={...Object.fromEntries(new FormData(form)),token};
  pending=true; submit.disabled=true; message.textContent='Đang lưu và tạo tệp…';
  google.script.run.withSuccessHandler(finish).withFailureHandler(err=>{
    pending=false; payload=null; submit.disabled=false; message.textContent=err.message; message.scrollIntoView();
  }).taoTuPhieu(payload);
};
</script></body></html>
